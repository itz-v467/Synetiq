# Optional: run from repo root with
#   docker compose -f infra/compose/docker-compose.dev.yml up --build
# Prefer: docker compose up --build (uses root docker-compose.yml)

name: synetiq

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: synetiq-nginx
    ports:
      - "8080:80"
    volumes:
      - ../../infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      args:
        BUILD_REVISION: ${BUILD_REVISION:-local}
    container_name: synetiq-api
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/synetiq
      REDIS_URL: redis://redis:6379/0
      CHROMA_PATH: /data/chroma
      ALLOWED_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      SMTP_ENABLED: "true"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_FROM: "noreply@synetiq.ai"
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        BUILD_REVISION: ${BUILD_REVISION:-local}
    container_name: synetiq-frontend
    environment:
      NODE_ENV: production
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    container_name: synetiq-postgres
    environment:
      POSTGRES_DB: synetiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d synetiq"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: synetiq-redis
    expose:
      - "6379"

  mailpit:
    image: axllent/mailpit
    container_name: synetiq-mailpit
    ports:
      - "8025:8025"
    expose:
      - "1025"
    environment:
      MP_MAX_MESSAGES: 500

  celery-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      args:
        BUILD_REVISION: ${BUILD_REVISION:-local}
    container_name: synetiq-celery-worker
    command: celery -A backend.app.workers.celery_app worker --loglevel=info
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/synetiq
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "false"
      SMTP_ENABLED: "true"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_FROM: "noreply@synetiq.ai"
    depends_on:
      - redis
      - postgres
      - api
      - mailpit
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  chroma_data:
